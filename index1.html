<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link Page</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f0f11;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            text-align: center;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 1.5rem;
            font-weight: 400;
            letter-spacing: -0.5px;
        }

        /* Styling the link to look like a premium button */
        .btn-link {
            display: inline-block;
            text-decoration: none;
            background-color: #ffffff;
            color: #000000;
            padding: 0.8rem 2rem;
            font-size: 1rem;
            font-weight: 500;
            border-radius: 4px;
            transition: opacity 0.2s ease, transform 0.2s ease;
        }

        .btn-link:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .btn-link:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Welcome</h1>
        <a href="bca_ai_cloud_devops_guide" class="btn-link">Go to Page</a>
        <a href="bca_ai_rew" class="btn-link">bca_ai_cloud_devops_guide</a>
      
    </div>

</body>
</html>
